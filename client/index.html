    <!-- Preconnect to the only critical third-party origins:
         Google Fonts CSS + the fonts CDN. Unsplash dropped: the
         holding page doesn't use unsplash assets. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- DNS-prefetch only for the analytics origin that loads on
         every page (GA). LinkedIn / Apollo / Google reCAPTCHA load
         conditionally after interaction or with a 5-6s delay — the
         resolver hop is cheaper than the wasted prefetch on cold
         start where they often never fire at all. -->
    <link rel="dns-prefetch" href="//www.googletagmanager.com">
    
    <!-- reCAPTCHA v2 checkbox widget is loaded dynamically by the app.
         Dev keys are used in NODE_ENV=development; production keys on constancia.io. -->
    
    <!-- Hero image preload is handled via HTTP Link header in server/static.ts
         which dynamically resolves the correct build hash at startup. -->

    <!-- LCP candidate on the launch holding page is the video poster.
         Preload it so it paints alongside the critical CSS rather than
         after the video metadata round-trip. -->
    <link rel="preload" as="image" href="/launch-film-poster.jpg" fetchpriority="high">

    <!-- Holding page doesn't need FC session — prefetch is now
         issued from FinanceCompassEntry on actual navigation. -->


    <!-- Font preloading removed: Google Fonts rotates CDN URLs across versions,
         causing stale preload links to 404 in production. The CSS stylesheet
         handles font loading via display=swap which is sufficient. -->

    <!-- Fonts: Noto Sans (primary UI per launch brief), DM Sans (legacy
         marketing headings still in use on sub-pages), IBM Plex Mono
         (eyebrows). Inter dropped — wasn't being referenced anywhere
         live. Weight set trimmed to what actually renders so the
         stylesheet response is materially smaller. Non-blocking via the
         media="print" / onload swap trick. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet"></noscript>
    
    <!-- Critical CSS for initial paint - prevents FOUC and improves FCP.
         Includes root variables, navigation, hero, and button styles
         so page can render while the 32KB main stylesheet downloads. -->
    <style>
      :root{--bg:60 33% 99%;--fg:220 5% 14%;--primary:215 97% 19%;--secondary:197 100% 52%;--radius:.5rem;--font-sans:"DM Sans",Inter,system-ui,-apple-system,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace}
      .dark{--bg:220 5% 8%;--fg:60 33% 97%}
      *,::before,::after{margin:0;padding:0;box-sizing:border-box}
      html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      /* Cream background — matches the Constancia brand bg #F6F3EE so
         there's no navy flash before React/Tailwind apply. */
      body{margin:0;font-family:"Noto Sans","DM Sans",system-ui,-apple-system,sans-serif;background:#252826;color:#F6F3EE;line-height:1.5;overflow-x:hidden}
      #root{min-height:100vh;min-height:100svh}
      h1,h2,h3,h4,h5,h6{font-weight:700;line-height:1.2;margin-bottom:1rem}
      h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.25rem}
      button,[role="button"]{display:inline-flex;align-items:center;justify-content:center;padding:0.625rem 1.25rem;border:none;border-radius:var(--radius);font-weight:600;cursor:pointer;font-family:inherit}
      /* Note: no global header background here — each header sets its
         own. The previous navy default was bleeding through under the
         library-nav-bar and rendering as a band across the top. */
    </style>
    
    <!-- GA / Search Console verification moved to the end of <body>
         so it doesn't compete with critical CSS, fonts, and the
         video poster for head parser time. dataLayer is still
         seeded inline so any pre-React click handler can push. -->
    <script>window.dataLayer = window.dataLayer || [];</script>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics — loaded after main.tsx kicks off so it
         doesn't compete on the critical path. Still picks up
         Search Console verification because the gtag() config
         calls run on script load. -->
    <script async fetchpriority="low" src="https://www.googletagmanager.com/gtag/js?id=G-4YK3EC0B5Q"></script>
    <script>
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4YK3EC0B5Q');
      gtag('config', 'AW-17757915012');
    </script>

    <!-- Deferred third-party scripts - load after page is fully interactive -->
    <script>
      var scheduleLoad = window.requestIdleCallback || function(cb) { setTimeout(cb, 1); };

      // Read marketing consent stored by the React cookie-consent component
      function hasMarketingConsent() {
        try {
          var c = JSON.parse(localStorage.getItem("cookie-consent") || "null");
          return !!(c && c.marketing);
        } catch(e) { return false; }
      }

      // LinkedIn Insight Tag — loads at most once, only with marketing consent
      var linkedInLoaded = false;
      function loadLinkedIn() {
        if (linkedInLoaded) return;
        linkedInLoaded = true;
        window._linkedin_partner_id = "8610860";
        window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
        window._linkedin_data_partner_ids.push(window._linkedin_partner_id);
        (function(l) {
          if (!l) { window.lintrk = function(a,b){window.lintrk.q.push([a,b]);}; window.lintrk.q=[]; }
          var s = document.getElementsByTagName("script")[0];
          var b = document.createElement("script");
          b.type = "text/javascript"; b.async = true;
          b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
          s.parentNode.insertBefore(b, s);
        })(window.lintrk);
      }

      // Fire LinkedIn immediately when the user grants consent mid-session
      // (consent-updated is dispatched by cookie-consent.tsx after every save)
      window.addEventListener("consent-updated", function(e) {
        if (e.detail && e.detail.marketing) {
          scheduleLoad(loadLinkedIn);
        }
      });

      // Deferred load of non-critical third-party scripts
      var analyticsLoaded = false;
      function loadDeferredScripts() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;

        // LinkedIn — only fires if the user has already granted marketing consent
        if (hasMarketingConsent()) {
          setTimeout(function() { scheduleLoad(loadLinkedIn); }, 500);
        }

        // HubSpot disabled - removed to prevent chat widget on public pages

        // Apollo.io Website Tracker (delay 6s for better LCP)
        setTimeout(function() {
          (function initApollo(){
            var n = Math.random().toString(36).substring(7);
            var o = document.createElement("script");
            o.src = "https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache=" + n;
            o.async = true; o.defer = true;
            o.onload = function() {
              window.trackingFunctions.onLoad({ appId: "697681c3e5b60000152f3c17" });
            };
            document.head.appendChild(o);
          })();
        }, 6000);
      }

      ['scroll', 'click', 'touchstart', 'keydown'].forEach(function(event) {
        document.addEventListener(event, loadDeferredScripts, { once: true, passive: true });
      });
      setTimeout(loadDeferredScripts, 5000);
    </script>
  </body>
